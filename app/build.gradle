plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rkdesain.marmut'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rkdesain.marmut'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
